[project]
name = "mediscribe-ner"
version = "0.1.0"
description = "Auditable clinical NER and post-transcription documentation service"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9",
  "pdfplumber>=0.11,<1",
]

[project.optional-dependencies]
ml = ["transformers>=4.45,<5", "torch>=2.3"]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
