services:
  - type: web
    name: mediscribe-ai
    runtime: python
    buildCommand: "./render-build.sh"
    startCommand: "uvicorn mediscribe.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: src
      - key: WHISPER_MODEL
        value: base
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_DEVICE
        value: cpu
      - key: MAX_AUDIO_SIZE_MB
        value: 25
      - key: HF_TOKEN
        sync: false
